[package]
name = "vorax-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lib]
name = "vorax"
path = "src/lib.rs"

[[bin]]
name = "vorax"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

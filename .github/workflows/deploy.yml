name: Update data and deploy

on:
  push:
    branches: [main]
  schedule:
    # Every 6 hours: pull fresh simulator data + live telemetry during the season.
    - cron: '17 */6 * * *'
    # Mondays: update dependencies within their package.json ranges (update-deps).
    - cron: '43 6 * * 1'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-data:
    # Only scheduled/manual runs refresh data; pushes just rebuild.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Update season data
        run: |
          for script in events/*/scripts/update_data.py; do
            python3 -I "$script"
          done
      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A events/
          git commit -m "chore(data): update season data"
          git push

  update-deps:
    # Minor and patch updates inside the "^" ranges, gated like a commit. Majors stay a manual call.
    # pnpm's minimumReleaseAge (1 day by default) skips releases too new to trust.
    needs: update-data
    if: ${{ !failure() && !cancelled() && (github.event.schedule == '43 6 * * 1' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Latest commit, including one just pushed by update-data; full history for the e2e tests.
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0 # exact, as in the lint job
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Update within ranges
        id: update
        run: |
          # --no-save: pnpm 12 also rewrites the "^" ranges in package.json, which the check below rejects (2026-10-26 run).
          pnpm update --no-save
          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then
            echo "Nothing to update."
            exit 0
          fi
          # Only the lockfile may change; anything else (a release-age exclusion, a manifest edit) needs a person.
          if [ "$changed" != " M pnpm-lock.yaml" ]; then
            echo "Unexpected changes:"
            echo "$changed"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - if: steps.update.outputs.changed == 'true'
        run: pnpm lint && pnpm format:check && pnpm check && pnpm test:e2e
      - name: Commit
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): update dependencies within their ranges" pnpm-lock.yaml
          git push

  lint:
    # Same gate as the pre-commit hook (lint, format, types), for commits that never ran it.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the play sheet's "Last simulation" is the commit time of engine_results.json
          # (src/sheets/ss14/sim-time.ts); a shallow clone has none, and its two e2e tests skipped on every run.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0 # exact: a bare "26" takes the runner's cached 26.x, days behind security releases
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check
      # Browser checks on the built site; Google Chrome comes with the runner (playwright.config.ts → channel).
      - run: pnpm test:e2e

  build:
    needs: [update-data, update-deps, lint]
    # Run after update-data and update-deps, or on its own when they were skipped (push).
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Latest commit on the branch, including one just pushed by update-data or update-deps.
          ref: ${{ github.ref }}
          # Full history: the SS14 play sheet dates "Last simulation" by the commit of engine_results.json.
          fetch-depth: 0
      - name: Set SITE and BASE_PATH for GitHub Pages
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "SITE=https://${owner}.github.io" >> "$GITHUB_ENV"
          echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
      - uses: withastro/action@v6
        with:
          package-manager: pnpm@12.15.0
          node-version: 26.13.0 # exact, as in the lint job

  deploy:
    needs: build
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
